name: Build & Deploy

on:
    release:
        types:
            - published

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: runner
                  tags: |
                      ghcr.io/satyamahendra/svtyv:latest
                      ghcr.io/satyamahendra/svtyv:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
                      NEXT_PUBLIC_MIDTRANS_URL=${{ secrets.NEXT_PUBLIC_MIDTRANS_URL }}

            - name: Build and Push Migrator Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: migrator
                  # Only `:latest` — the migrator is static per prisma version, so
                  # a per-SHA tag would push a new manifest on every release for
                  # an image whose content never changed.
                  tags: ghcr.io/satyamahendra/svtyv-migrator:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy Containers to VPS via SSH
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  command_timeout: 30m
                  envs: >-
                      GITHUB_TOKEN,GITHUB_ACTOR,APP_TAG,
                      POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,
                      DATABASE_URL,NODE_ENV,
                      BETTER_AUTH_SECRET,BETTER_AUTH_URL,
                      GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,
                      MIDTRANS_SERVER_KEY,MIDTRANS_IS_PRODUCTION,
                      WHITELISTED_EMAILS
                  script: |
                      # 1. Log into GHCR
                      echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

                      # 2. Ensure isolated Docker network exists
                      docker network create svtyv-net || true

                      # 3. Pull the updated app image.
                      #    Pinned to the release SHA, not `:latest` — a SHA tag is
                      #    immutable, so the pull can't race a concurrent release.
                      docker pull ghcr.io/satyamahendra/svtyv:$APP_TAG

                      # 3b. Migrator is static across releases; only fetch it once.
                      docker image inspect ghcr.io/satyamahendra/svtyv-migrator:latest >/dev/null 2>&1 \
                        || docker pull ghcr.io/satyamahendra/svtyv-migrator:latest

                      # 4. Stop and remove old instances safely
                      docker stop svtyv-app svtyv-db || true
                      docker rm svtyv-app svtyv-db || true

                      # 5. Spin up Postgres
                      docker run -d \
                      --name svtyv-db \
                      --network svtyv-net \
                      --restart unless-stopped \
                      -p 127.0.0.1:5433:5432 \
                      -v postgres_data:/var/lib/postgresql/data \
                      -e POSTGRES_USER="$POSTGRES_USER" \
                      -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
                      -e POSTGRES_DB="$POSTGRES_DB" \
                      postgres:17-alpine

                      sleep 10

                      # 6. Run migrations (one-shot container, exits when done)
                      docker run --rm \
                      --name svtyv-migrator \
                      --network svtyv-net \
                      -e DATABASE_URL="$DATABASE_URL" \
                      ghcr.io/satyamahendra/svtyv-migrator:latest

                      # 7. Spin up the app (no prisma needed)
                      docker run -d \
                      --name svtyv-app \
                      --network svtyv-net \
                      --restart unless-stopped \
                      -p 3001:3000 \
                      -e DATABASE_URL="$DATABASE_URL" \
                      -e NODE_ENV="$NODE_ENV" \
                      -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
                      -e BETTER_AUTH_URL="$BETTER_AUTH_URL" \
                      -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
                      -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
                      -e MIDTRANS_SERVER_KEY="$MIDTRANS_SERVER_KEY" \
                      -e MIDTRANS_IS_PRODUCTION="$MIDTRANS_IS_PRODUCTION" \
                      -e WHITELISTED_EMAILS="$WHITELISTED_EMAILS" \
                      ghcr.io/satyamahendra/svtyv:"$APP_TAG"

                      # 8. Clean up old dangling images
                      docker image prune -f
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACTOR: ${{ github.actor }}
                  APP_TAG: ${{ github.sha }}
                  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  NODE_ENV: ${{ secrets.NODE_ENV }}
                  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
                  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
                  MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION }}
                  WHITELISTED_EMAILS: ${{ secrets.WHITELISTED_EMAILS }}
